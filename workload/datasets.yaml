tokenizer: Qwen/Qwen2.5-7B          # สลับได้
max_samples: 5000                    # cap ต่อ dataset
min_tokens: 10000                    # ต่ำกว่านี้ warn ว่า β ไม่น่าเชื่อถือ
pbe_steps: [1, 2, 4]                 # PBE@1, @2, @4
pbe_prefix_len: 3                    # ความยาว prefix สำหรับ PBE

datasets:
  # ── Code ──
  - id: code_humaneval
    hf_path: openai/openai_humaneval
    split: test                      # มีแค่ test (164 samples)
    family: code
    text_combine: [prompt, canonical_solution]

  - id: code_mbpp
    hf_path: google-research-datasets/mbpp
    split: train
    family: code
    text_column: code

  - id: code_python_instruct        # แทน the-stack (gated) — non-gated, ไม่ต้อง login
    hf_path: iamtarun/python_code_instructions_18k_alpaca
    split: train
    family: code
    text_combine: [instruction, output]

  - id: math_metamath              # แทน codecontests (stream ช้าเกิน) — flat, tokenize เร็ว
    hf_path: meta-math/MetaMathQA
    split: train
    family: math
    text_combine: [query, response]

  # ── Natural Language ──
  - id: nl_wikitext103
    hf_path: Salesforce/wikitext
    hf_config: wikitext-103-raw-v1
    split: train
    family: nl
    text_column: text

  - id: nl_cnndailymail
    hf_path: abisee/cnn_dailymail
    hf_config: "3.0.0"
    split: train
    family: nl
    text_combine: [article, highlights]

  - id: nl_openwebtext
    hf_path: Skylion007/openwebtext
    split: train
    family: nl
    text_column: text
    streaming: true

  # ── Math / Reasoning ──
  - id: math_gsm8k
    hf_path: openai/gsm8k
    hf_config: main
    split: train
    family: math
    text_combine: [question, answer]

  - id: math_math
    hf_path: nlile/hendrycks-MATH-benchmark   # lighteval/MATH เป็น loading-script เก่า ใช้ไม่ได้
    split: train
    family: math
    text_combine: [problem, solution]

  # ── Dialogue / Chat ──
  - id: dialogue_alpaca
    hf_path: tatsu-lab/alpaca
    split: train
    family: dialogue
    text_combine: [instruction, output]   # input เป็น optional — concat ถ้ามี

  - id: dialogue_samsum
    hf_path: knkarthick/samsum    # Samsung/samsum เป็น loading-script เก่า ใช้ไม่ได้
    split: train
    family: dialogue
    text_combine: [dialogue, summary]

  - id: dialogue_dolly
    hf_path: databricks/databricks-dolly-15k
    split: train
    family: dialogue
    text_combine: [instruction, response]
